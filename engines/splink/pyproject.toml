[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-product-platform-splink-engine"
version = "0.1.0"
description = "Replaceable Splink candidate-generation runtime for Data Product Platform"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "pandas>=2.2,<3",
  "splink==4.0.17",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

# The container copies the FastAPI runtime after installing dependencies. This
# distribution intentionally carries dependency metadata only; do not let
# setuptools auto-discover the sibling `models/` directory as a package.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
