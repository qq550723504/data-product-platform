# Synthetic local demo only. Only the console has a host port, bound to loopback.
x-core-environment: &core-environment
  APP_ENV: poc-demo
  APP_HTTP_ADDR: ':8080'
  POSTGRES_DSN: postgres://postgres:demo-only@postgres:5432/dpp_demo?sslmode=disable
  REDIS_ADDR: redis:6379
  REDIS_DB: '0'
  OBJECT_STORAGE_ENDPOINT: minio:9000
  OBJECT_STORAGE_ACCESS_KEY: demo-only
  OBJECT_STORAGE_SECRET_KEY: demo-only-not-production
  OBJECT_STORAGE_BUCKET: dpp-demo
  OBJECT_STORAGE_USE_SSL: 'false'
  INDUSTRY_PACK_ROOT: /opt/dpp/industry-packs
  OPENMETADATA_ENABLED: 'false'
  HOP_ENABLED: 'false'
  SPLINK_ENABLED: 'false'
  HUMAN_DECISION_API_ENABLED: 'true'
  HUMAN_DECISION_API_TOKEN: demo-review-secret
  HUMAN_DECISION_API_SUBJECT: demo-reviewer
  HUMAN_DECISION_API_ACTOR_ID: 22222222-2222-4222-8222-222222222222
  HUMAN_DECISION_API_WORKSPACE_IDS: 11111111-1111-4111-8111-111111111111
  POC_DEMO_ACK: SYNTHETIC_LOCAL_ONLY
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dpp_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: demo-only
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d dpp_demo']
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  minio:
    # Historical verified baseline; not a security-current production recommendation.
    image: ghcr.io/coollabsio/minio@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: demo-only
      MINIO_ROOT_PASSWORD: demo-only-not-production
    volumes: [object-data:/data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    image: '${COMPOSE_PROJECT_NAME}-core:local'
    build:
      context: .
      dockerfile: deploy/demo/Dockerfile.core
    environment: *core-environment
    command: [api]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health/ready]
      interval: 2s
      timeout: 2s
      retries: 30
  worker:
    image: '${COMPOSE_PROJECT_NAME}-core:local'
    environment: *core-environment
    command: [worker]
    depends_on:
      api: {condition: service_healthy}
  migrate:
    image: '${COMPOSE_PROJECT_NAME}-core:local'
    profiles: [tools]
    environment: *core-environment
    command: [migrate, -direction, up, -dir, /opt/dpp/migrations]
  seed:
    image: '${COMPOSE_PROJECT_NAME}-core:local'
    profiles: [tools]
    environment: *core-environment
    entrypoint: [poc-demo]
    command: [prepare]
    volumes: [demo-state:/demo-state]
  web:
    build:
      context: .
      dockerfile: deploy/demo/Dockerfile.web
    environment:
      HUMAN_DECISION_API_TOKEN: demo-review-secret
    volumes: [demo-state:/demo-state:ro]
    ports: ['127.0.0.1:3180:3000']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/reviews').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  pg-data:
  redis-data:
  object-data:
  demo-state:
