name: acceptance-identity
on:
  workflow_call:
permissions:
  contents: read
jobs:
  user-profile-product:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: apps/platform/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked web and pinned browser dependencies
        run: |
          npm ci --ignore-scripts --prefix apps/web
          npm install --ignore-scripts --prefix tests/browser
          cd tests/browser && npx playwright install --with-deps chromium
      - name: Prepare isolated user profile product and verify actual API
        env:
          MANAGEMENT_FIXTURE_ACK: ISOLATED_READONLY_MANAGEMENT
          MANAGEMENT_USER_PRODUCT_FIXTURE_ACK: ISOLATED_USER_PRODUCT_READONLY
          MANAGEMENT_WEB_DIST: .next-acceptance-identity-management-user-product-20261027
        run: |
          python3 tests/platform-management/bootstrap.py
          python3 tests/platform-management/test-main-service.py
          python3 tests/platform-management/directory-product-contract.py
          python3 tests/platform-management/start-web.py --build
      - name: Whole settings product navigation and current authority browser acceptance
        env:
          MANAGEMENT_FIXTURE_ACK: ISOLATED_READONLY_MANAGEMENT
          MANAGEMENT_USER_PRODUCT_FIXTURE_ACK: ISOLATED_USER_PRODUCT_READONLY
          MANAGEMENT_BROWSER_CHANNEL: chromium
        run: |
          node tests/platform-management/user-product-browser.mjs
          python3 tests/platform-management/verify-main-service.py
      - name: Preserve non-secret user profile product results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: management-user-product-results
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .data/management-user-product-20261027/go-regression.json
            .data/management-user-product-20261027/product-contract-results.json
            .data/management-user-product-20261027/retained-comparison.json
            .data/management-user-product-20261027/retained-final-comparison.json
            .data/management-user-product-browser-20261027/browser-results.json
            .data/management-user-product-browser-20261027/screenshots/
  identity-1a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: apps/platform/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Container preservation regression including optimized Python
        run: |
          python3 -B -m unittest discover -s tests -p test_fixture_preservation.py -v
          python3 -O -B -m unittest discover -s tests -p test_fixture_preservation.py -v
      - name: Install locked web and pinned browser dependencies
        run: |
          npm ci --ignore-scripts --prefix apps/web
          npm install --ignore-scripts --prefix tests/browser
          cd tests/browser && npx playwright install --with-deps chromium
      - name: Verify full document readiness before readonly page refresh
        run: node tests/browser/readonly-navigation.test.mjs
      - name: Preserve non-secret readonly navigation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readonly-browser-navigation-results
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: .data/readonly-browser-navigation-20261026/results.json
      - name: Prepare NEW independent TLS IdP and readonly 1A fixture
        env:
          ACCEPTANCE_IDENTITY_PREPARE_ACK: NEW_ISOLATED_1A_ONLY
        run: python3 tests/acceptance-identity/bootstrap.py
      - name: Verify minimal privileges and independent people/workspaces in browser
        env:
          ACCEPTANCE_BROWSER_CHANNEL: chromium
        run: |
          node tests/acceptance-identity/privileges.mjs
          node tests/acceptance-identity/browser.mjs
      - name: Preserve non-secret acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-identity-1a-results
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .data/acceptance-identity-1a/browser-results.json
            .data/acceptance-identity-1a/privilege-results.json
            .data/acceptance-identity-1a/screenshots/
            .data/acceptance-identity-1a/retained-comparison.json
      - name: Prepare independent management query fixture
        env:
          MANAGEMENT_FIXTURE_ACK: ISOLATED_READONLY_MANAGEMENT
        run: |
          python3 tests/platform-management/bootstrap.py
          python3 tests/platform-management/start-web.py --build
      - name: Management members roles audit and revocation browser acceptance
        env:
          MANAGEMENT_BROWSER_CHANNEL: chromium
        run: node tests/platform-management/browser.mjs
      - name: Preserve non-secret management results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-management-readonly-results
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .data/management-readonly-20261025/browser-results.json
            .data/management-readonly-20261025/screenshots/
            .data/management-readonly-20261025/retained-comparison.json
      - name: Readonly repeated preservation observations of the owned management fixture
        env:
          MANAGEMENT_FIXTURE_ACK: ISOLATED_READONLY_MANAGEMENT
        run: python3 tests/platform-management/probe-preservation.py
      - name: Prepare independent runtime log API and permission fixture
        env:
          MANAGEMENT_FIXTURE_ACK: ISOLATED_READONLY_MANAGEMENT
          MANAGEMENT_RUNTIME_LOG_FIXTURE_ACK: ISOLATED_RUNTIME_LOG_READONLY
          MANAGEMENT_WEB_DIST: .next-acceptance-identity-management-runtime-logs-20261026
        run: |
          python3 tests/platform-management/bootstrap.py
          python3 tests/platform-management/start-web.py --build
      - name: Runtime log HTTP OIDC PostgreSQL and page acceptance
        env:
          RUNTIME_LOG_BROWSER_CHANNEL: chromium
        run: node tests/runtime-logs/api-browser.mjs
      - name: Whole settings readonly acceptance on the same runtime log API host
        env:
          MANAGEMENT_RUNTIME_LOG_FIXTURE_ACK: ISOLATED_RUNTIME_LOG_READONLY
          MANAGEMENT_BROWSER_CHANNEL: chromium
          MANAGEMENT_BROWSER_OUTPUT: management-readonly-runtime-review-20261026
        run: node tests/platform-management/browser.mjs
      - name: Preserve runtime log API acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-log-api-readonly-results
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .data/runtime-logs-api-20261026/api-browser-results.json
            .data/runtime-logs-api-20261026/screenshots/
            .data/management-readonly-runtime-review-20261026/browser-results.json
            .data/management-readonly-runtime-review-20261026/screenshots/
            .data/runtime-logs-api-20261026/retained-comparison.json
            .data/platform-management-preservation-20261026/retained-order-probe.json
      - name: Prepare independent main service query composition and PG regression
        env:
          MANAGEMENT_FIXTURE_ACK: ISOLATED_READONLY_MANAGEMENT
          MANAGEMENT_MAIN_SERVICE_FIXTURE_ACK: ISOLATED_MAIN_SERVICE_READONLY
          MANAGEMENT_WEB_DIST: .next-acceptance-identity-management-main-service-20261026
        run: |
          python3 tests/platform-management/bootstrap.py
          python3 tests/platform-management/test-main-service.py
          python3 tests/platform-management/start-web.py --build
      - name: Main service audit-only composition and modern settings browser acceptance
        env:
          MANAGEMENT_BROWSER_CHANNEL: chromium
          MANAGEMENT_FIXTURE_ACK: ISOLATED_READONLY_MANAGEMENT
          MANAGEMENT_MAIN_SERVICE_FIXTURE_ACK: ISOLATED_MAIN_SERVICE_READONLY
        run: |
          node tests/platform-management/main-service-browser.mjs
          python3 tests/platform-management/verify-main-service.py
      - name: Preserve non-secret main service query results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: management-main-service-query-results
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .data/management-main-service-20261026/go-regression.json
            .data/management-main-service-20261026/retained-comparison.json
            .data/management-main-service-20261026/retained-final-comparison.json
            .data/management-main-service-browser-20261026/main-service-browser-results.json
            .data/management-main-service-browser-20261026/screenshots/
      - name: Prepare independent shared composition compatibility fixture
        env:
          MANAGEMENT_FIXTURE_ACK: ISOLATED_READONLY_MANAGEMENT
          MANAGEMENT_MAIN_SERVICE_COMPAT_FIXTURE_ACK: ISOLATED_MAIN_SERVICE_COMPAT_READONLY
          MANAGEMENT_WEB_DIST: .next-acceptance-identity-management-main-service-compat-20261026
        run: |
          python3 tests/platform-management/bootstrap.py
          python3 tests/platform-management/test-main-service.py
          python3 tests/platform-management/start-web.py --build
      - name: Shared composition directory and runtime log compatibility acceptance
        env:
          MANAGEMENT_FIXTURE_ACK: ISOLATED_READONLY_MANAGEMENT
          MANAGEMENT_MAIN_SERVICE_COMPAT_FIXTURE_ACK: ISOLATED_MAIN_SERVICE_COMPAT_READONLY
          MANAGEMENT_BROWSER_CHANNEL: chromium
          RUNTIME_LOG_BROWSER_CHANNEL: chromium
        run: |
          node tests/platform-management/compat-boundaries.mjs
          node tests/platform-management/browser.mjs
          node tests/runtime-logs/api-browser.mjs
          python3 tests/platform-management/verify-main-service.py
      - name: Preserve non-secret shared composition compatibility results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: management-main-service-compat-results
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .data/management-main-service-compat-20261026/go-regression.json
            .data/management-main-service-compat-20261026/retained-comparison.json
            .data/management-main-service-compat-20261026/retained-final-comparison.json
            .data/management-main-service-compat-boundaries-20261026/boundary-results.json
            .data/management-readonly-main-service-compat-20261026/browser-results.json
            .data/management-readonly-main-service-compat-20261026/screenshots/
            .data/runtime-logs-review-main-service-compat-20261026/api-browser-results.json
            .data/runtime-logs-review-main-service-compat-20261026/screenshots/
      - name: Prepare isolated product directory configuration and actual main entrypoint
        env:
          MANAGEMENT_FIXTURE_ACK: ISOLATED_READONLY_MANAGEMENT
          MANAGEMENT_DIRECTORY_PRODUCT_FIXTURE_ACK: ISOLATED_DIRECTORY_PRODUCT_READONLY
          MANAGEMENT_WEB_DIST: .next-acceptance-identity-management-directory-product-20261026
        run: |
          python3 tests/platform-management/bootstrap.py
          python3 tests/platform-management/test-main-service.py
          python3 tests/platform-management/directory-product-contract.py
          python3 tests/platform-management/start-web.py --build
      - name: Product directory organization members and current authority browser acceptance
        env:
          MANAGEMENT_FIXTURE_ACK: ISOLATED_READONLY_MANAGEMENT
          MANAGEMENT_DIRECTORY_PRODUCT_FIXTURE_ACK: ISOLATED_DIRECTORY_PRODUCT_READONLY
          MANAGEMENT_BROWSER_CHANNEL: chromium
        run: |
          node tests/platform-management/directory-product-browser.mjs
          python3 tests/platform-management/verify-main-service.py
      - name: Preserve non-secret product directory acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: management-directory-product-results
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .data/management-directory-product-20261026/go-regression.json
            .data/management-directory-product-20261026/product-contract-results.json
            .data/management-directory-product-20261026/retained-comparison.json
            .data/management-directory-product-20261026/retained-final-comparison.json
            .data/management-directory-product-browser-20261026/browser-results.json
            .data/management-directory-product-browser-20261026/screenshots/
