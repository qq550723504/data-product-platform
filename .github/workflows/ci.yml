name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - codex/poc-consolidated-local-demo
      - codex/csv-ingestion-review-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-platform:
    name: go-platform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: data_product_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d data_product_platform"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/data_product_platform?sslmode=disable
      TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/data_product_platform?sslmode=disable
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: apps/platform/go.sum

      - name: Verify dependency lock is tidy
        run: |
          cp go.mod /tmp/go.mod.before
          cp go.sum /tmp/go.sum.before
          go mod tidy
          diff -u /tmp/go.mod.before go.mod
          diff -u /tmp/go.sum.before go.sum

      - name: Format check
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "$UNFORMATTED"
            for file in $UNFORMATTED; do
              gofmt -d "$file" || true
            done
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Validate local compose file
        run: docker compose -f ../../deploy/docker-compose/docker-compose.yml config >/dev/null

      - name: Apply database migrations
        run: go run ./cmd/migrate -direction up -dir ../../migrations

      - name: Test
        run: go test ./...

      - name: Build API / worker / migrate
        run: |
          go build ./cmd/api
          go build ./cmd/worker
          go build ./cmd/migrate

  web-console:
    name: web-console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      PLATFORM_API_BASE_URL: http://localhost:8080
      POC_WORKSPACE_ID: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke production console routes
        shell: bash
        run: |
          set -euo pipefail
          npm start -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/web-console.log" 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true; cat "$RUNNER_TEMP/web-console.log"' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            if ! kill -0 "$WEB_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/web-console.log"
              exit 1
            fi
            sleep 1
          done

          for route in \
            / \
            /resources \
            /datasets \
            /production \
            /reviews \
            /products \
            /evidence \
            /products/11111111-1111-4111-8111-111111111111 \
            /products/11111111-1111-4111-8111-111111111111/releases/22222222-2222-4222-8222-222222222222; do
            curl -fsS "http://127.0.0.1:3000${route}" >/dev/null
          done

  hop-smoke:
    name: hop-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Hop reference changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_hop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD^"
          fi

          CHANGED="$(git diff --name-only "$BASE" HEAD -- \
            'examples/enterprise-activity/hop/**' \
            'examples/enterprise-activity/workflow/energy-monthly-hop-v1.yaml' \
            'apps/platform/internal/workflow/hop/**' \
            'apps/platform/internal/workflow/application/managed_execution.go' \
            'apps/platform/internal/workflow/transport/queue/handler.go')"
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED"
            echo "run_hop=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_hop=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pinned Apache Hop reference pipeline
        if: steps.changes.outputs.run_hop == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE_DIR="$RUNNER_TEMP/hop-smoke"
          rm -rf "$FIXTURE_DIR"
          mkdir -p "$FIXTURE_DIR"
          cp examples/enterprise-activity/hop/aggregate-energy-monthly.hpl "$FIXTURE_DIR/"
          cp examples/enterprise-activity/hop/energy-standardized-input.csv "$FIXTURE_DIR/"
          cp examples/enterprise-activity/hop/energy-monthly-expected.csv "$FIXTURE_DIR/"
          chmod -R a+rwX "$FIXTURE_DIR"

          docker pull apache/hop:2.19.0
          docker run --rm \
            -v "$FIXTURE_DIR:/files" \
            --entrypoint /opt/hop/hop-run.sh \
            apache/hop:2.19.0 \
            -f /files/aggregate-energy-monthly.hpl \
            -r local \
            -p 'INPUT_ENERGY_STANDARDIZED_URI=/files/energy-standardized-input.csv,OUTPUT_BASE_URI=/files/ci-output,CORE_EXECUTION_ID=ci-smoke,TARGET_PERIOD=2025-02'

          test -s "$FIXTURE_DIR/ci-output.csv"

          python3 - "$FIXTURE_DIR/ci-output.csv" "$FIXTURE_DIR/energy-monthly-expected.csv" <<'PY'
          import csv
          import sys

          def normalize(path):
              with open(path, newline='', encoding='utf-8-sig') as handle:
                  rows = list(csv.DictReader(handle))
              return sorted(
                  (
                      row['canonical_company_id'].strip(),
                      row['year_month'].strip(),
                      round(float(row['energy_kwh']), 12),
                  )
                  for row in rows
              )

          actual = normalize(sys.argv[1])
          expected = normalize(sys.argv[2])
          if actual != expected:
              raise SystemExit(f"Hop output mismatch\nexpected={expected!r}\nactual={actual!r}")
          print(f"validated {len(actual)} Apache Hop aggregate rows")
          PY

      - name: Skip Hop runtime smoke when unrelated
        if: steps.changes.outputs.run_hop != 'true'
        run: echo "No Hop reference/runtime files changed; smoke test skipped."

  splink-smoke:
    name: splink-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Splink adapter changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_splink=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD^"
          fi

          CHANGED="$(git diff --name-only "$BASE" HEAD -- \
            'engines/splink/**' \
            'apps/platform/internal/entity/splink/**' \
            'apps/platform/internal/entity/matching/**' \
            'apps/platform/internal/entity/application/**' \
            'industry-packs/park/matching/company-match-policy-v1.yaml' \
            'industry-packs/park/matching/splink-company-model-v1.yaml' \
            'examples/entity-resolution-evaluation/**')"
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED"
            echo "run_splink=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_splink=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.changes.outputs.run_splink == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engines/splink/pyproject.toml

      - name: Install pinned Splink runtime
        if: steps.changes.outputs.run_splink == 'true'
        run: python -m pip install './engines/splink[test]'

      - name: Verify Splink runtime/API imports
        if: steps.changes.outputs.run_splink == 'true'
        shell: bash
        run: |
          python -m compileall -q engines/splink/app engines/splink/scripts
          PYTHONPATH=engines/splink python - <<'PY'
          from importlib.metadata import version
          from splink import DuckDBAPI, Linker
          from app.main import POLICY_REF, POLICY_VERSION, ReferenceRecord, _probability, _reference_row

          assert version('splink') == '4.0.17', version('splink')
          assert DuckDBAPI is not None and Linker is not None
          assert POLICY_REF == 'park-company-match'
          assert POLICY_VERSION == '1.0.0'
          reference = _reference_row(ReferenceRecord(
              entityId='11111111-1111-1111-1111-111111111111',
              name='Acme',
              fields={'canonical_key': '91440300TESTUSCC'},
          ))
          assert reference['unified_social_credit_code'] == '91440300TESTUSCC', reference
          # Non-finite probabilities must not be clamped into a confident match.
          assert _probability(None) == 0.0
          assert _probability(0.87) == 0.87
          assert _probability(-1) == 0.0
          assert _probability(2) == 1.0
          for unusable in (float('nan'), 'nan', float('inf'), float('-inf'), 'not-a-number'):
              assert _probability(unusable) is None, unusable
          print('validated Splink', version('splink'), 'and COMPANY reference schema')
          PY

      - name: Run Splink script unit tests
        if: steps.changes.outputs.run_splink == 'true'
        working-directory: engines/splink
        run: python -m pytest -q

      - name: Evaluate labelled company matching reference set
        if: steps.changes.outputs.run_splink == 'true'
        run: |
          python engines/splink/scripts/evaluate_reference.py \
            --assert-quality \
            --model-out "$RUNNER_TEMP/park-company-v1-model.json" \
            --report "$RUNNER_TEMP/entity-resolution-evaluation.json"
          test -s "$RUNNER_TEMP/park-company-v1-model.json"
          test -s "$RUNNER_TEMP/entity-resolution-evaluation.json"

      - name: Skip Splink runtime smoke when unrelated
        if: steps.changes.outputs.run_splink != 'true'
        run: echo "No Splink runtime/adapter/evaluation files changed; smoke test skipped."

  browser-contracts:
    uses: ./.github/workflows/web-browser.yml
  live-core:
    uses: ./.github/workflows/live-core-browser.yml
  demo:
    uses: ./.github/workflows/demo-lifecycle.yml

  required:
    name: required
    if: ${{ always() }}
    needs: [go-platform, web-console, hop-smoke, splink-smoke, browser-contracts, live-core, demo]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fail-closed gate policy
        run: node --test .github/scripts/required-checks.test.mjs
      - name: Require all seven CI jobs to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/required-checks.mjs
      - name: Archive the verified source snapshot
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/verified-source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
      - name: Preserve verified source for review and reproduction
        uses: actions/upload-artifact@v4
        with:
          name: verified-source-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/verified-source.zip
            ${{ runner.temp }}/source-sha.txt
