name: trial-contracts
on:
  pull_request:
    paths: ['deploy/trial/**', 'apps/platform/cmd/trial-prepare/**', 'apps/platform/cmd/trial-resume/**', 'apps/platform/cmd/trial-activate/**', 'apps/platform/cmd/trial-business/**', '.github/workflows/trial-contracts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ownership:
    runs-on: windows-latest
    # Both complete suites run sequentially. The normal 135-test run alone
    # takes about 146s on Windows; include setup and the full -O run budget.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test retained trial lifecycle and native readonly verification (no Docker)
        run: python -B -m unittest discover -s deploy/trial -p 'test_*.py'
      - name: Test retained trial lifecycle with assertions disabled (no Docker)
        run: python -O -B -m unittest discover -s deploy/trial -p 'test_*.py'
