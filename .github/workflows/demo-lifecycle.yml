name: demo-lifecycle
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-lifecycle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  demo-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Demo command safety tests
        run: node --test deploy/demo/demo.test.mjs
      - name: Confirmed disposal driver safety tests (no provider I/O)
        run: |
          python3 -m unittest discover -s examples/lifecycle-d1 -p test_confirmed_race.py -v
          python3 -O -m unittest discover -s examples/lifecycle-d1 -p test_confirmed_race.py -v
          python3 -m unittest discover -s examples/lifecycle-d1 -p test_reference_delete_preflight.py -v
          python3 -O -m unittest discover -s examples/lifecycle-d1 -p test_reference_delete_preflight.py -v
          python3 -m unittest discover -s examples/lifecycle-d1 -p test_reference_disposal_preparation.py -v
          python3 -O -m unittest discover -s examples/lifecycle-d1 -p test_reference_disposal_preparation.py -v
          python3 -m unittest discover -s examples/lifecycle-d1 -p test_native_d1_completion.py -v
          python3 -O -m unittest discover -s examples/lifecycle-d1 -p test_native_d1_completion.py -v
          python3 -m unittest discover -s examples/lifecycle-d1 -p test_lc13_readonly.py -v
          python3 -O -m unittest discover -s examples/lifecycle-d1 -p test_lc13_readonly.py -v
          python3 -m unittest discover -s examples/lifecycle-d1 -p test_reference_history.py -v
          python3 -O -m unittest discover -s examples/lifecycle-d1 -p test_reference_history.py -v
          python3 -m unittest discover -s examples/lifecycle-d1 -p test_reference_candidate05.py -v
          python3 -O -m unittest discover -s examples/lifecycle-d1 -p test_reference_candidate05.py -v
          python3 -m unittest discover -s examples/lifecycle-d1 -p test_reference_candidate05_check.py -v
          python3 -O -m unittest discover -s examples/lifecycle-d1 -p test_reference_candidate05_check.py -v
          python3 -m unittest discover -s examples/lifecycle-d1 -p test_reference_candidate05_history.py -v
          python3 -O -m unittest discover -s examples/lifecycle-d1 -p test_reference_candidate05_history.py -v
          python3 examples/lifecycle-d1/check-reference-candidate05-history.py
          python3 examples/lifecycle-d1/check-remaining-v16-history.py
          python3 .github/scripts/check-lifecycle307-history.py
          python3 -m unittest discover -s examples/lifecycle-d1 -p test_remaining_window.py -v
          python3 -O -m unittest discover -s examples/lifecycle-d1 -p test_remaining_window.py -v
          python3 -m unittest discover -s examples/lifecycle-d1 -p test_freeze_remaining_executable.py -v
          python3 -O -m unittest discover -s examples/lifecycle-d1 -p test_freeze_remaining_executable.py -v
          python3 -m unittest discover -s examples/lifecycle-d1 -p test_verify_remaining_native.py -v
          python3 -O -m unittest discover -s examples/lifecycle-d1 -p test_verify_remaining_native.py -v
          python3 -B examples/lifecycle-d1/test_complete_remaining_preflight.py
          python3 -O -B examples/lifecycle-d1/test_complete_remaining_preflight.py
          python3 -B examples/lifecycle-d1/test_p1_post_v22_readonly.py
          python3 -O -B examples/lifecycle-d1/test_p1_post_v22_readonly.py
          python3 -B examples/lifecycle-d1/test_old_business_dispatch_closure.py
          python3 -O -B examples/lifecycle-d1/test_old_business_dispatch_closure.py
          python3 -B examples/lifecycle-d1/test_post_v22_seventeen.py
          python3 -O -B examples/lifecycle-d1/test_post_v22_seventeen.py
          python3 -B examples/lifecycle-d1/test_remaining_sequence.py
          python3 -O -B examples/lifecycle-d1/test_remaining_sequence.py
          python3 -B examples/lifecycle-d1/test_remaining_six_window.py
          python3 -O -B examples/lifecycle-d1/test_remaining_six_window.py
          python3 -B examples/lifecycle-d1/test_six_candidate_runtime.py
          python3 -O -B examples/lifecycle-d1/test_six_candidate_runtime.py
          python3 -B examples/lifecycle-d1/test_freeze_six_candidate.py
          python3 -O -B examples/lifecycle-d1/test_freeze_six_candidate.py
          python3 -B examples/lifecycle-d1/test_window_six_support.py
          python3 -O -B examples/lifecycle-d1/test_window_six_support.py
          python3 -B examples/lifecycle-d1/test_verify_six_native.py
          python3 -O -B examples/lifecycle-d1/test_verify_six_native.py
          python3 -B examples/lifecycle-d1/test_evidence_indexes.py
          python3 -O -B examples/lifecycle-d1/test_evidence_indexes.py
          python3 -B examples/lifecycle-d1/test_six_native_entry.py
          python3 -O -B examples/lifecycle-d1/test_six_native_entry.py
          python3 -B examples/lifecycle-d1/test_retained_v26.py
          python3 -O -B examples/lifecycle-d1/test_retained_v26.py
      - name: Check archived candidate04 with its frozen runtime (no provider I/O)
        run: python3 examples/lifecycle-d1/check-reference-history.py
      - name: Install isolated browser runner
        run: npm --prefix tests/live-browser install --no-audit --no-fund
      - name: Install Chromium
        working-directory: tests/live-browser
        run: npx playwright install --with-deps chromium
      - name: Build, migrate and initialize shipped Compose demo
        run: node deploy/demo/demo.mjs up
      - name: Review, advance, publish, verify and restart without losing history
        run: node deploy/demo/smoke.mjs
      - name: Collect service logs
        if: ${{ always() }}
        run: |
          mkdir -p .artifacts/demo
          node deploy/demo/demo.mjs logs > .artifacts/demo/services.log 2>&1 || true
          git rev-parse HEAD > .artifacts/demo/source-sha.txt
      - name: Preserve lifecycle evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: demo-lifecycle-${{ github.run_attempt }}
          path: .artifacts/demo/
          include-hidden-files: true
          retention-days: 7
      - name: Remove only the disposable demo
        if: ${{ always() }}
        run: node deploy/demo/demo.mjs reset --confirm=DELETE_DEMO_DATA
