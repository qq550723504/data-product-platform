# Disposable integration services only. Never use for deployment or real data.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dpp_browser_live
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:15432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dpp_browser_live"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  label-studio:
    # Same pinned Label Studio Community 1.23.0 reference runtime used by the
    # annotation adapter smoke gate. Disposable test infrastructure only.
    image: heartexlabs/label-studio@sha256:aa461572e8f9d86a1bf9520c1db620204e86160fd2f80dd7e9d40ac84a8828ea
    ports: ["127.0.0.1:18082:8080"]
    volumes: [live-label-studio:/label-studio/data]
    environment:
      LABEL_STUDIO_HOST: http://localhost:18082
      USERNAME: live@example.com
      PASSWORD: label-studio-live-password
      DISABLE_SIGNUP_WITHOUT_LINK: "1"
      LABEL_STUDIO_ENABLE_LEGACY_API_TOKEN: "true"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen(\'http://127.0.0.1:8080/\', timeout=2)\" >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    # Historical test baseline, not a claim that this is a supported/security-current deployment image.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["127.0.0.1:19000:9000"]
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  live-label-studio:
